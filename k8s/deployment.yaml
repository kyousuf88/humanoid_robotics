apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-chatbot-backend
  labels:
    app: rag-chatbot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rag-chatbot
  template:
    metadata:
      labels:
        app: rag-chatbot
    spec:
      containers:
      - name: backend
        image: rag-chatbot-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: COHERE_API_KEY
          valueFrom:
            secretKeyRef:
              name: rag-chatbot-secrets
              key: cohere-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: rag-chatbot-secrets
              key: openai-api-key
        - name: QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: rag-chatbot-secrets
              key: qdrant-api-key
        - name: QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: rag-chatbot-secrets
              key: qdrant-url
        - name: NEON_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rag-chatbot-secrets
              key: neon-database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rag-chatbot-secrets
              key: secret-key
        - name: DEBUG
          value: "false"
        - name: LOG_LEVEL
          value: "INFO"
        - name: RATE_LIMIT_REQUESTS
          value: "100"
        - name: RATE_LIMIT_WINDOW
          value: "3600"
        - name: OPENAI_MODEL
          value: "gpt-4"
        - name: COHERE_MODEL
          value: "embed-multilingual-v3.0"
        - name: BOOK_LANGUAGE
          value: "en"
        - name: CACHE_ENABLED
          value: "true"
        - name: CACHE_SIZE
          value: "2000"
        - name: CACHE_DEFAULT_TTL
          value: "7200"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rag-chatbot-service
spec:
  selector:
    app: rag-chatbot
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-chatbot-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - your-domain.com
    secretName: rag-chatbot-tls
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rag-chatbot-service
            port:
              number: 80