apiVersion: v1
kind: Secret
metadata:
  name: rag-chatbot-secrets
type: Opaque
data:
  # All values should be base64 encoded
  # Example: echo -n 'your-secret-value' | base64
  cohere-api-key: <base64-encoded-cohere-api-key>
  openai-api-key: <base64-encoded-openai-api-key>
  qdrant-api-key: <base64-encoded-qdrant-api-key>
  qdrant-url: <base64-encoded-qdrant-url>
  neon-database-url: <base64-encoded-neon-database-url>
  secret-key: <base64-encoded-secret-key>